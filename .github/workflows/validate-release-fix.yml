name: Validate Pisi 0.11.0 Release Fix

on:
  push:
    branches:
      - release/0.11.0-validation-fix
    paths:
      - .github/workflows/validate-release-fix.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      BRANCH: release/0.11.0-validation-fix
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/0.11.0-validation-fix

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - id: install
        name: Install dependencies without Electron binary
        continue-on-error: true
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - id: validate
        name: Validate source
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run validate

      - id: audit
        name: Audit dependencies
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run audit

      - name: Record status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL: ${{ steps.install.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
        run: |
          printf 'install=%s\nvalidate=%s\naudit=%s\n' "$INSTALL" "$VALIDATE" "$AUDIT" > status.txt
          content=$(base64 -w0 status.txt)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.validation-v0.11.0.txt" \
            -f message='Record v0.11.0 fix validation' \
            -f content="$content" \
            -f branch="$BRANCH"
