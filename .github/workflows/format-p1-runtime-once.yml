name: Format P1 Runtime Once

on:
    push:
        branches:
            - main
        paths:
            - .github/workflows/format-p1-runtime-once.yml

permissions:
    contents: write

jobs:
    format:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: main

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Format changed files
              run: >
                  npx prettier
                  main/functions/project-integrity-documents.js
                  main/functions/project-integrity-repairs.js
                  main/functions/project-integrity.js
                  main/functions/project-integrity-properties.js
                  tests/project-integrity-contract.test.js
                  tests/property-schema-stability.test.js
                  --write

            - name: Commit formatting
              run: |
                  if git diff --quiet; then
                    echo "No formatting changes needed."
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add main/functions/project-integrity-documents.js \
                          main/functions/project-integrity-repairs.js \
                          main/functions/project-integrity.js \
                          main/functions/project-integrity-properties.js \
                          tests/project-integrity-contract.test.js \
                          tests/property-schema-stability.test.js
                  git commit -m "Format P1 runtime cleanup"
                  git push origin HEAD:main
