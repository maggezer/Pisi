name: P3.9 Format Preview

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Show Prettier diff
        run: |
          npx prettier renderer/editor/pisi-editor-sheet-selection.mjs --write
          git diff -- renderer/editor/pisi-editor-sheet-selection.mjs
