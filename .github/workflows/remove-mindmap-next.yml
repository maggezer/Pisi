name: Remove Mind Map Next

on:
  push:
    branches:
      - chatgpt/remove-mindmap-next-20260820
    paths:
      - .github/workflows/remove-mindmap-next.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt/remove-mindmap-next-20260820

      - name: Remove Next UI and handler
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          operational = Path('renderer/map/pisi-map-operational.mjs')
          text = operational.read_text(encoding='utf-8')
          text = text.replace(", next: 'Sıradaki'", "", 1)
          text = text.replace(", next: 'Next'", "", 1)

          summary_start = text.index("    const nextButton = document.getElementById('pisi-map-operational-next');")
          summary_end = text.index("\n}\n\nfunction schedulePisiOperationalRender", summary_start)
          text = text[:summary_start] + text[summary_end:]

          text = text.replace("        ['pisi-map-operational-next', 'next'],\n", "", 1)
          text = text.replace("        'focus', 'next', 'deps', 'labels', 'work',", "        'focus', 'deps', 'labels', 'work',", 1)
          text = text.replace("        buttons.focus, buttons.next,\n", "        buttons.focus,\n", 1)
          text = text.replace("    document.getElementById('pisi-map-operational-next')?.addEventListener('click', focusNextPisiOperationalNode);\n", "", 1)

          function_start = text.index('function focusNextPisiOperationalNode() {')
          function_end = text.index('async function createPisiOperationalLinkedNode()', function_start)
          text = text[:function_start] + text[function_end:]

          text = text.replace("    focusNextPisiOperationalNode,\n", "")

          if 'pisi-map-operational-next' in text or 'focusNextPisiOperationalNode' in text:
              raise SystemExit('Next UI/function reference remains in operational module')
          operational.write_text(text, encoding='utf-8')

          panel = Path('renderer/map/pisi-map-right-panel.mjs')
          panel_text = panel.read_text(encoding='utf-8')
          panel_text = '\n'.join(
              line for line in panel_text.split('\n')
              if 'pisi-map-operational-next' not in line
          )
          if 'pisi-map-operational-next' in panel_text:
              raise SystemExit('Next panel reference remains')
          panel.write_text(panel_text, encoding='utf-8')

          test_file = Path('tests/mindmap-tools-compact.test.js')
          test_text = test_file.read_text(encoding='utf-8')
          test_text = '\n'.join(
              line for line in test_text.split('\n')
              if "'pisi-map-operational-next'," not in line
          )
          anchor = "    assert.match(panel, /assets\\/map-tools\\.svg/);"
          if 'assert.doesNotMatch(panel, /pisi-map-operational-next/);' not in test_text:
              test_text = test_text.replace(
                  anchor,
                  anchor + "\n    assert.doesNotMatch(panel, /pisi-map-operational-next/);",
                  1
              )
          test_file.write_text(test_text, encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- renderer/map/pisi-map-operational.mjs renderer/map/pisi-map-right-panel.mjs tests/mindmap-tools-compact.test.js
          git commit -m "Remove Mind Map Next action"
          git push
