name: Apply Todo second release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/todo-second-release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Todo second release branch
        uses: actions/checkout@v4
        with:
          ref: agent/todo-second-release
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check integration script syntax
        run: node --check scripts/apply-todo-second-release.js

      - name: Apply Todo second release integration
        run: node scripts/apply-todo-second-release.js

      - name: Install dependencies without Electron binary
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Validate source
        run: npm run validate

      - name: Remove one-time integration files
        run: |
          rm -f scripts/apply-todo-second-release.js
          rm -f .github/workflows/apply-todo-second-release.yml

      - name: Commit Todo second release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Todo second release"
          git push origin agent/todo-second-release
