name: Complete Pisi internal rename

on:
  push:
    branches:
      - agent/pisi-full-rename-final
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rename:
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message == 'Trigger full Pisi rename') ||
      (github.event_name == 'pull_request' && github.head_ref == 'agent/pisi-full-rename-final')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/pisi-full-rename-final
          fetch-depth: 0

      - name: Rename all internal Kedi identifiers to Pisi
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path.cwd()
          excluded_dirs = {
              '.git', 'node_modules', 'dist', 'coverage', 'out',
              'release', '.gradle', 'build'
          }
          text_suffixes = {
              '.js', '.cjs', '.mjs', '.json', '.html', '.css', '.scss',
              '.md', '.txt', '.yml', '.yaml', '.ps1', '.xml', '.java',
              '.gradle', '.properties', '.svg', '.ts', '.tsx', '.jsx'
          }
          text_names = {'.gitignore', '.gitattributes', '.npmrc', 'LICENSE'}
          replacements = (
              ('KEDI', 'PISI'),
              ('Kedi', 'Pisi'),
              ('kedi', 'pisi'),
          )
          protected_repo_paths = {
              'maggezer/Kedi': '__PISI_GITHUB_REPOSITORY__',
              'maggezer%2FKedi': '__PISI_GITHUB_REPOSITORY_ESCAPED__',
          }

          def excluded(path: Path) -> bool:
              try:
                  relative = path.relative_to(root)
              except ValueError:
                  return True
              return any(part in excluded_dirs for part in relative.parts)

          def transform(value: str) -> str:
              result = value
              for original, placeholder in protected_repo_paths.items():
                  result = result.replace(original, placeholder)
              for old, new in replacements:
                  result = result.replace(old, new)
              for original, placeholder in protected_repo_paths.items():
                  result = result.replace(placeholder, original)
              return result

          changed_text_files = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or excluded(path):
                  continue
              if path.suffix.lower() not in text_suffixes and path.name not in text_names:
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = transform(original)
              if updated != original:
                  path.write_text(updated, encoding='utf-8', newline='\n')
                  changed_text_files.append(str(path.relative_to(root)))

          renamed_paths = []
          candidates = [path for path in root.rglob('*') if not excluded(path)]
          candidates.sort(key=lambda path: len(path.parts), reverse=True)

          for path in candidates:
              if not path.exists():
                  continue
              new_name = transform(path.name)
              if new_name == path.name:
                  continue
              destination = path.with_name(new_name)
              if destination.exists():
                  raise RuntimeError(
                      f'Rename collision: {path.relative_to(root)} -> '
                      f'{destination.relative_to(root)}'
                  )
              old_relative = str(path.relative_to(root))
              path.rename(destination)
              renamed_paths.append(
                  f'{old_relative} -> {destination.relative_to(root)}'
              )

          print(f'Updated text files: {len(changed_text_files)}')
          print(f'Renamed paths: {len(renamed_paths)}')
          for item in renamed_paths:
              print(f'  {item}')
          PY

      - name: Align lint configuration with Electron preload
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          config_path = Path('eslint.config.js')
          text = config_path.read_text(encoding='utf-8')

          ignore_needle = "            'node_modules/**'"
          ignore_replacement = """            'node_modules/**',
              'android/**/build/**',
              'android/.gradle/**',
              '.gradle/**'"""
          if ignore_needle not in text:
              raise RuntimeError('ESLint ignore list could not be updated.')
          text = text.replace(ignore_needle, ignore_replacement, 1)

          globals_needle = "                structuredClone: 'readonly'"
          globals_replacement = """                structuredClone: 'readonly',
                  document: 'readonly',
                  fetch: 'readonly',
                  localStorage: 'readonly',
                  MutationObserver: 'readonly',
                  Node: 'readonly',
                  URL: 'readonly',
                  window: 'readonly'"""
          if globals_needle not in text:
              raise RuntimeError('ESLint preload globals could not be updated.')
          text = text.replace(globals_needle, globals_replacement, 1)

          config_path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Remove one-time automation files
        shell: bash
        run: |
          rm -f .github/workflows/complete-pisi-rename.yml
          rm -f .pisi-refactor-trigger

      - name: Verify no internal Kedi names remain
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path.cwd()
          excluded_dirs = {
              '.git', 'node_modules', 'dist', 'coverage', 'out',
              'release', '.gradle', 'build'
          }
          text_suffixes = {
              '.js', '.cjs', '.mjs', '.json', '.html', '.css', '.scss',
              '.md', '.txt', '.yml', '.yaml', '.ps1', '.xml', '.java',
              '.gradle', '.properties', '.svg', '.ts', '.tsx', '.jsx'
          }
          text_names = {'.gitignore', '.gitattributes', '.npmrc', 'LICENSE'}
          pattern = re.compile(r'kedi', re.IGNORECASE)
          problems = []

          def excluded(path: Path) -> bool:
              relative = path.relative_to(root)
              return any(part in excluded_dirs for part in relative.parts)

          for path in root.rglob('*'):
              if excluded(path):
                  continue
              relative = str(path.relative_to(root))
              if pattern.search(path.name):
                  problems.append(f'path: {relative}')
              if not path.is_file():
                  continue
              if path.suffix.lower() not in text_suffixes and path.name not in text_names:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for line_number, line in enumerate(text.splitlines(), 1):
                  if not pattern.search(line):
                      continue
                  cleaned = line.replace('maggezer/Kedi', '').replace('maggezer%2FKedi', '')
                  if not pattern.search(cleaned):
                      continue
                  problems.append(f'{relative}:{line_number}: {line.strip()}')

          if problems:
              print('Old internal name remains:', file=sys.stderr)
              print('\n'.join(problems[:200]), file=sys.stderr)
              sys.exit(1)

          print('No internal Kedi identifiers remain.')
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate project
        run: npm run validate

      - name: Commit transformed source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Complete internal rename from Kedi to Pisi"
          git push origin HEAD:agent/pisi-full-rename-final
