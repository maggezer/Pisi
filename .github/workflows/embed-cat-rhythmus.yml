name: Embed CAT Rhythmus TTF

on:
  push:
    branches:
      - chatgpt/fix-cat-rhythmus-show-completed-20260820
    paths:
      - .github/workflows/embed-cat-rhythmus.yml

permissions:
  contents: write

jobs:
  embed-font:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download CAT Rhythmus TTF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          curl -fL --retry 3 --retry-delay 2 \
            "https://st.1001fonts.net/download/font/cat-rhythmus.regular.ttf" \
            -o assets/fonts/cat-rhythmus.regular.ttf
          test -s assets/fonts/cat-rhythmus.regular.ttf
          file assets/fonts/cat-rhythmus.regular.ttf

      - name: Commit embedded font
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/fonts/cat-rhythmus.regular.ttf
          if ! git diff --cached --quiet; then
            git commit -m "Embed CAT Rhythmus TTF"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
