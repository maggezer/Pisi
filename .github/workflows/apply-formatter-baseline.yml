name: Apply Formatter Baseline

on:
    push:
        branches:
            - main
        paths:
            - '.github/workflows/apply-formatter-baseline.yml'

permissions:
    contents: write

jobs:
    apply-baseline:
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies without Electron binary
              env:
                  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
              run: npm ci --ignore-scripts

            - name: Apply repository-wide Prettier baseline
              run: npm run format

            - name: Harden formatting-sensitive tests
              shell: bash
              run: |
                  set -euo pipefail
                  normalized_patch="$RUNNER_TEMP/pisi-hardening.patch"
                  for patch_file in .github/prettier-hardening/*.patch; do
                    cat "$patch_file" > "$normalized_patch"
                    printf '\n' >> "$normalized_patch"
                    git apply --unidiff-zero --check "$normalized_patch"
                    git apply --unidiff-zero "$normalized_patch"
                  done

            - name: Normalize hardened tests
              run: npm run format

            - name: Validate formatted repository
              run: npm run validate

            - name: Check whitespace
              run: git diff --check

            - name: Commit formatter baseline
              shell: bash
              run: |
                  set -euo pipefail
                  if git diff --quiet; then
                    echo "Formatter baseline already clean."
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  git commit -m "Apply repository-wide Prettier baseline"
                  git push origin HEAD:main
