name: Architecture refactor

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - architecture-analysis.json

permissions:
  contents: write

jobs:
  analyze:
    if: github.event.pull_request.head.ref == 'agent/architecture-refactor'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-refactor
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Analyze CSS and JavaScript architecture
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const espree = require('espree');

          const root = process.cwd();
          const jsFiles = [
            'app.js',
            'renderer/pisi-tree.js',
            'renderer/pisi-map-workspace.js',
            'renderer/pisi-tags.js',
            'renderer/pisi-calendar.js',
            'renderer/pisi-node-modal.js',
            'renderer/pisi-map-connections.js'
          ];

          function walk(node, visitor, parent = null) {
            if (!node || typeof node !== 'object') return;
            visitor(node, parent);
            for (const [key, value] of Object.entries(node)) {
              if (key === 'parent') continue;
              if (Array.isArray(value)) value.forEach((item) => walk(item, visitor, node));
              else if (value && typeof value === 'object' && typeof value.type === 'string') walk(value, visitor, node);
            }
          }

          const declarationOwners = new Map();
          const files = {};

          for (const file of jsFiles) {
            const source = fs.readFileSync(path.join(root, file), 'utf8');
            const ast = espree.parse(source, {
              ecmaVersion: 'latest',
              sourceType: 'script',
              range: true,
              loc: true
            });
            const declarations = [];
            for (const statement of ast.body) {
              if (statement.type === 'FunctionDeclaration' && statement.id) {
                declarations.push({name: statement.id.name, kind: 'function', start: statement.loc.start.line, end: statement.loc.end.line});
              }
              if (statement.type === 'VariableDeclaration') {
                for (const decl of statement.declarations) {
                  if (decl.id.type === 'Identifier') {
                    declarations.push({name: decl.id.name, kind: statement.kind, start: statement.loc.start.line, end: statement.loc.end.line});
                  }
                }
              }
            }
            for (const decl of declarations) {
              if (!declarationOwners.has(decl.name)) declarationOwners.set(decl.name, []);
              declarationOwners.get(decl.name).push(file);
            }
            files[file] = {
              lines: source.split(/\r?\n/).length,
              declarations,
              dependencies: []
            };
          }

          for (const file of jsFiles) {
            const source = fs.readFileSync(path.join(root, file), 'utf8');
            const ast = espree.parse(source, {ecmaVersion: 'latest', sourceType: 'script', range: true, loc: true});
            const own = new Set(files[file].declarations.map((item) => item.name));
            const dependencies = new Map();
            walk(ast, (node, parent) => {
              if (node.type !== 'Identifier') return;
              if (!declarationOwners.has(node.name) || own.has(node.name)) return;
              if (parent) {
                if ((parent.type === 'MemberExpression' && parent.property === node && !parent.computed) ||
                    (parent.type === 'Property' && parent.key === node && !parent.computed) ||
                    (parent.type === 'FunctionDeclaration' && parent.id === node) ||
                    (parent.type === 'VariableDeclarator' && parent.id === node)) return;
              }
              for (const owner of declarationOwners.get(node.name)) {
                if (owner === file) continue;
                const key = `${owner}:${node.name}`;
                dependencies.set(key, {owner, name: node.name});
              }
            });
            files[file].dependencies = [...dependencies.values()].sort((a,b) => a.owner.localeCompare(b.owner) || a.name.localeCompare(b.name));
          }

          const duplicateGlobals = [...declarationOwners.entries()]
            .filter(([, owners]) => new Set(owners).size > 1)
            .map(([name, owners]) => ({name, owners: [...new Set(owners)]}));

          const css = fs.readFileSync(path.join(root, 'style.css'), 'utf8');
          const selectorLocations = new Map();
          const importantLocations = [];
          const ruleRegex = /(^|\})\s*([^@{}][^{}]*)\{([^{}]*)\}/gm;
          let match;
          while ((match = ruleRegex.exec(css))) {
            const selector = match[2].trim().replace(/\s+/g, ' ');
            if (!selector) continue;
            const line = css.slice(0, match.index + match[1].length).split('\n').length;
            if (!selectorLocations.has(selector)) selectorLocations.set(selector, []);
            selectorLocations.get(selector).push(line);
            const body = match[3];
            let importantIndex = body.indexOf('!important');
            while (importantIndex !== -1) {
              const absolute = match.index + match[0].indexOf(body) + importantIndex;
              importantLocations.push(css.slice(0, absolute).split('\n').length);
              importantIndex = body.indexOf('!important', importantIndex + 1);
            }
          }

          const duplicateSelectors = [...selectorLocations.entries()]
            .filter(([, lines]) => lines.length > 1)
            .map(([selector, lines]) => ({selector, count: lines.length, lines}))
            .sort((a,b) => b.count - a.count || a.selector.localeCompare(b.selector));

          const report = {
            generatedAt: new Date().toISOString(),
            javascript: {
              files,
              duplicateGlobals,
              totalCrossFileDependencies: Object.values(files).reduce((sum, file) => sum + file.dependencies.length, 0)
            },
            css: {
              lines: css.split(/\r?\n/).length,
              duplicateSelectors,
              duplicateSelectorCount: duplicateSelectors.length,
              importantCount: importantLocations.length,
              importantLines: importantLocations
            }
          };

          fs.writeFileSync('architecture-analysis.json', JSON.stringify(report, null, 2) + '\n');
          NODE

      - name: Commit analysis report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture-analysis.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add architecture analysis report"
          git push origin HEAD:agent/architecture-refactor
