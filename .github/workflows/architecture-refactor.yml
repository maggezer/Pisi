name: Architecture refactor

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.pull_request.head.ref == 'agent/architecture-refactor'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-refactor
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply architecture refactor
        run: node scripts/refactor-architecture.js

      - name: Remove one-time files
        run: |
          rm -f scripts/refactor-architecture.js
          rm -f architecture-analysis.json
          rm -f .github/workflows/architecture-refactor.yml

      - name: Validate project
        run: npm run validate

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refactor CSS and module architecture"
          git push origin HEAD:agent/architecture-refactor
