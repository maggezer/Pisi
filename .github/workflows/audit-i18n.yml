name: Apply complete i18n

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout i18n branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-i18n
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify and apply staged i18n payload
        run: |
          verify_segment() {
            file="$1"
            expected_length="$2"
            expected_hash="$3"
            clean="/tmp/$(basename "$file").clean"
            tr -d '\r\n\t ' < "$file" > "$clean"
            actual_length="$(wc -c < "$clean" | tr -d ' ')"
            test "$actual_length" = "$expected_length" || {
              echo "$file length mismatch: $actual_length != $expected_length"
              exit 1
            }
            echo "$expected_hash  $clean" | sha256sum -c -
          }

          verify_segment scripts/.i18n-payload-00a 6000 48a665621f8b76663eed5b90d52885494fd4008dc7be53239b43b8fc926f0641
          verify_segment scripts/.i18n-payload-00b 6000 ab03898a492574c59b913861dead68d1e03bb16203f5c5c8aa2ec32f6db0160a
          verify_segment scripts/.i18n-payload-01a 6000 de0389a4eeca11f4ae9c01b31eddb005cf213a241a157440c9c3fa7fc375c494
          verify_segment scripts/.i18n-payload-01b 6000 e5276ac287f6bb9871beadcd9176a826dd1156461dfe357fdabacf7c524ee472
          verify_segment scripts/.i18n-payload-02a 6000 ec7ab7dd56434761ce44093970e3bac6e4c33f17a27038373fda665c5c93951c
          verify_segment scripts/.i18n-payload-02b 6000 160899a469b0217ed37541f47c8de5a0bfe510e53c0819c670314f8d651dcf9a
          verify_segment scripts/.i18n-payload-03a 6000 f4773511f4e2fed90c910ca0dc8c18e3757ba937f25b56017e83128d54dc1731
          verify_segment scripts/.i18n-payload-03b 6000 7e3b8f82a08d2f8b3821d19c5865ad50c43961ba6ffe2bbde00b8f7bebc290be
          verify_segment scripts/.i18n-payload-04 7692 1ec6d3515e19a5f2eea576821958b5f666505c28e6bc3acb1836bf896e6ea26d

          cat \
            /tmp/.i18n-payload-00a.clean \
            /tmp/.i18n-payload-00b.clean \
            /tmp/.i18n-payload-01a.clean \
            /tmp/.i18n-payload-01b.clean \
            /tmp/.i18n-payload-02a.clean \
            /tmp/.i18n-payload-02b.clean \
            /tmp/.i18n-payload-03a.clean \
            /tmp/.i18n-payload-03b.clean \
            /tmp/.i18n-payload-04.clean \
            | base64 --decode > /tmp/i18n-payload.tar.gz
          echo "353a1d426c4fd7f6b65da55a2b7efb6f4e4385e0e017eca01000ffbb3e9fffb3  /tmp/i18n-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/i18n-payload.tar.gz
          rm -f scripts/audit-i18n-candidates.js
          rm -f i18n-audit.json i18n-audit-summary.json

      - name: Install dependencies without Electron binary
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Validate source
        run: npm run validate

      - name: Remove one-time payload
        run: |
          rm -f scripts/.i18n-payload-00 scripts/.i18n-payload-01 scripts/.i18n-payload-02 scripts/.i18n-payload-04
          rm -f scripts/.i18n-payload-00a scripts/.i18n-payload-00b
          rm -f scripts/.i18n-payload-01a scripts/.i18n-payload-01b
          rm -f scripts/.i18n-payload-02a scripts/.i18n-payload-02b
          rm -f scripts/.i18n-payload-03a scripts/.i18n-payload-03b
          rm -f .github/workflows/audit-i18n.yml

      - name: Commit complete i18n
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Internationalize Pisi in Turkish and English"
          git push origin agent/full-i18n
