name: Audit i18n candidates

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout i18n branch
        uses: actions/checkout@v4
        with:
          ref: agent/full-i18n
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate i18n inventory
        run: node scripts/audit-i18n-candidates.js

      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: i18n-inventory
          path: |
            i18n-audit.json
            i18n-audit-summary.json
          retention-days: 3

      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i18n-audit.json i18n-audit-summary.json
          git commit -m "Generate refined i18n inventory" || exit 0
          git push origin agent/full-i18n
