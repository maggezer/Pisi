name: Prettier Probe

on:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    diff:
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Show Prettier diff
              run: |
                  npx prettier scripts/electron-critical-regressions-e2e.mjs --write
                  git diff -- scripts/electron-critical-regressions-e2e.mjs
