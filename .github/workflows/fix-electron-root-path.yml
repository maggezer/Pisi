name: Fix Electron root paths

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Electron entry paths and regression test
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          electron_path = Path('main/functions/electron-ipc.js')
          source = electron_path.read_text(encoding='utf-8')

          import_anchor = "const { registerMainModule } = require('../module-registry');\n"
          root_declaration = "const PISI_APP_ROOT = path.resolve(__dirname, '..', '..');\n"

          if root_declaration not in source:
              if import_anchor not in source:
                  raise SystemExit('Electron module import anchor was not found.')
              source = source.replace(
                  import_anchor,
                  import_anchor + root_declaration,
                  1
              )

          replacements = {
              "preload: path.join(__dirname, 'preload.js')":
                  "preload: path.join(PISI_APP_ROOT, 'preload.js')",
              "mainWindow.loadFile(path.join(__dirname, 'index.html'));":
                  "mainWindow.loadFile(path.join(PISI_APP_ROOT, 'index.html'));",
          }

          for old, new in replacements.items():
              if old not in source and new not in source:
                  raise SystemExit(f'Expected Electron path fragment was not found: {old}')
              source = source.replace(old, new)

          electron_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/source-invariants.test.js')
          tests = test_path.read_text(encoding='utf-8')
          test_name = "Electron giriş dosyaları uygulama kökünden yüklenir"

          if test_name not in tests:
              addition = r'''

test('Electron giriş dosyaları uygulama kökünden yüklenir', () => {
    const electronIpc = read('main/functions/electron-ipc.js');
    assert.match(
        electronIpc,
        /const PISI_APP_ROOT = path\.resolve\(__dirname, '\.\.', '\.\.'\);/
    );
    assert.match(
        electronIpc,
        /preload: path\.join\(PISI_APP_ROOT, 'preload\.js'\)/
    );
    assert.match(
        electronIpc,
        /loadFile\(path\.join\(PISI_APP_ROOT, 'index\.html'\)\)/
    );
    assert.doesNotMatch(
        electronIpc,
        /path\.join\(__dirname, '(?:preload\.js|index\.html)'\)/
    );
});
'''
              test_path.write_text(tests.rstrip() + addition, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-electron-root-path.yml

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate fix
        run: npm run validate

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Electron application root paths"
          git push origin HEAD:main
