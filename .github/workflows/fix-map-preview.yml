name: Fix map preview text and title alignment

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-map-preview-nbsp-title'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-map-preview-nbsp-title
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Fix map preview and title
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const mapPath = 'main/functions/map-store.js';
          let mapSource = fs.readFileSync(mapPath, 'utf8');
          const oldPreview = `function stripPreviewText(value = '') {
              return String(value)
                  .replace(/<[^>]+>/g, ' ')
                  .replace(/\\s+/g, ' ')
                  .trim()
                  .slice(0, 600);
          }`;
          const newPreview = `function stripPreviewText(value = '') {
              return String(value)
                  .replace(/<[^>]+>/g, ' ')
                  .replace(/&(?:nbsp|#160|#x0*a0);/gi, ' ')
                  .replace(/\\u00a0/g, ' ')
                  .replace(/\\s+/g, ' ')
                  .trim()
                  .slice(0, 600);
          }`;
          if (!mapSource.includes(newPreview)) {
            if (!mapSource.includes(oldPreview)) {
              throw new Error('stripPreviewText beklenen biçimde bulunamadı.');
            }
            mapSource = mapSource.replace(oldPreview, newPreview);
            fs.writeFileSync(mapPath, mapSource, 'utf8');
          }

          const cssPath = 'styles/10-tree-and-map.css';
          let css = fs.readFileSync(cssPath, 'utf8');
          const titleNeedle = `    text-overflow: ellipsis;
              cursor: default;`;
          const titleReplacement = `    text-overflow: ellipsis;
              text-align: center;
              cursor: default;`;
          if (!css.includes(titleReplacement)) {
            if (!css.includes(titleNeedle)) {
              throw new Error('map-node-title CSS ekleme noktası bulunamadı.');
            }
            css = css.replace(titleNeedle, titleReplacement);
          }

          const inputNeedle = `    font-size: var(--pisi-map-node-title-size);
              font-weight: 700;
          }`;
          const inputReplacement = `    font-size: var(--pisi-map-node-title-size);
              font-weight: 700;
              text-align: center;
          }`;
          if (!css.includes(inputReplacement)) {
            if (!css.includes(inputNeedle)) {
              throw new Error('map-node-title-input CSS ekleme noktası bulunamadı.');
            }
            css = css.replace(inputNeedle, inputReplacement);
          }
          fs.writeFileSync(cssPath, css, 'utf8');

          const testPath = 'tests/map-preview.test.js';
          const testSource = `'use strict';

          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const test = require('node:test');
          const vm = require('node:vm');

          const root = path.resolve(__dirname, '..');
          const mapSource = fs.readFileSync(
              path.join(root, 'main/functions/map-store.js'),
              'utf8'
          );
          const css = fs.readFileSync(
              path.join(root, 'styles/10-tree-and-map.css'),
              'utf8'
          );

          test('map node önizlemesi non-breaking space değerlerini normal boşluğa çevirir', () => {
              const functionSource = mapSource.match(
                  /function stripPreviewText\\(value = ''\\) \\{[\\s\\S]*?\\n\\}/
              )?.[0];

              assert.ok(functionSource, 'stripPreviewText fonksiyonu bulunamadı.');
              const stripPreviewText = vm.runInNewContext(\`(\${functionSource})\`);

              assert.equal(
                  stripPreviewText('<div>#etiket&nbsp;deneme</div>'),
                  '#etiket deneme'
              );
              assert.equal(
                  stripPreviewText('A&#160;B&#xA0;C\\u00a0D'),
                  'A B C D'
              );
          });

          test('map node başlığı normal ve düzenleme görünümünde ortalanır', () => {
              const titleRule = css.match(/\\.map-node-title \\{[\\s\\S]*?\\n\\}/)?.[0] || '';
              const inputRule = css.match(/\\.map-node-title-input \\{[\\s\\S]*?\\n\\}/)?.[0] || '';

              assert.match(titleRule, /text-align:\\s*center;/);
              assert.match(inputRule, /text-align:\\s*center;/);
          });
          `;
          fs.writeFileSync(testPath, testSource.replace(/^          /gm, ''), 'utf8');
          NODE

      - name: Validate project
        run: npm run validate

      - name: Remove one-time workflow
        run: rm .github/workflows/fix-map-preview.yml

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/functions/map-store.js styles/10-tree-and-map.css tests/map-preview.test.js .github/workflows/fix-map-preview.yml
          git commit -m "Fix map preview spacing and center node titles"
          git push origin HEAD:agent/fix-map-preview-nbsp-title
