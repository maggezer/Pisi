name: Security Audit

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test safe audit fix
        shell: bash
        run: |
          npm audit fix --package-lock-only --ignore-scripts
          echo '--- PACKAGE DIFF ---'
          git diff -- package.json package-lock.json
          echo '--- AUDIT AFTER FIX ---'
          npm audit --json
