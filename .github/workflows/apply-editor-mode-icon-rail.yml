name: Apply editor mode icon rail

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/editor-mode-icon-rail'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/editor-mode-icon-rail
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Apply editor mode rail
        run: node scripts/apply-editor-mode-icon-rail.js

      - name: Validate project
        run: npm run validate

      - name: Remove one-time files
        run: |
          rm -f scripts/apply-editor-mode-icon-rail.js
          rm -f .github/workflows/apply-editor-mode-icon-rail.yml

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Move editor modes to right icon rail"
            git push origin HEAD:agent/editor-mode-icon-rail
          fi
