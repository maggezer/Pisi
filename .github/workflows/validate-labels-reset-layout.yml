name: Validate Labels and Reset Layout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-labels-reset-layout.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - id: validate
        continue-on-error: true
        run: npm run validate
      - name: Record outcome
        if: always()
        shell: bash
        run: |
          status='${{ steps.validate.outcome }}'
          printf 'validate=%s\ncommit=%s\n' "$status" "$GITHUB_SHA" > .validate-labels-reset-layout.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .validate-labels-reset-layout.txt
          git commit -m "Record Labels and Reset validation" || exit 0
          git push origin HEAD:main
          test "$status" = 'success'
