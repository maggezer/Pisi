name: Remove center editor header

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/remove-center-editor-header'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-center-editor-header
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Remove center editor header
        run: node scripts/remove-center-editor-header.cjs

      - name: Validate project
        run: npm run validate

      - name: Remove one-time files
        run: |
          rm -f scripts/remove-center-editor-header.cjs
          rm -f .github/center-editor-header-trigger
          rm -f .github/workflows/remove-center-editor-header.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles/40-editor.css tests/source-invariants.test.js scripts .github
          git commit -m "Remove center editor title and save bar"
          git push origin HEAD:agent/remove-center-editor-header
