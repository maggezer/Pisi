name: Fix editor caret regression

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/fix-editor-caret-regression'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-editor-caret-regression
          fetch-depth: 0

      - name: Repair codemod literal matching
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          script_path = Path('scripts/fix-editor-caret-regression.cjs')
          source = script_path.read_text(encoding='utf-8')
          old = """function replaceOnce(source, pattern, replacement, label) {
              const matches = source.match(pattern);
              if (!matches) {
                  throw new Error(`${label} fragment was not found.`);
              }
              return source.replace(pattern, replacement);
          }
          """
          new = """function replaceOnce(source, pattern, replacement, label) {
              if (typeof pattern === 'string') {
                  if (!source.includes(pattern)) {
                      throw new Error(`${label} fragment was not found.`);
                  }
                  return source.replace(pattern, replacement);
              }

              if (!pattern.test(source)) {
                  throw new Error(`${label} fragment was not found.`);
              }

              return source.replace(pattern, replacement);
          }
          """
          if old not in source:
              raise SystemExit('replaceOnce helper was not found.')
          script_path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply caret fix
        run: node scripts/fix-editor-caret-regression.cjs

      - name: Validate project
        run: npm run validate

      - name: Remove one-time files
        run: |
          rm -f scripts/fix-editor-caret-regression.cjs
          rm -f .github/caret-fix-trigger
          rm -f .github/workflows/fix-editor-caret.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renderer/tags/pisi-tag-index.mjs renderer/map/pisi-map-workspace.mjs tests/source-invariants.test.js scripts .github
          git commit -m "Preserve caret during editor normalization"
          git push origin HEAD:agent/fix-editor-caret-regression
