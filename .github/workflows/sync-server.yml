name: Sync server

# Pisi senkron sunucusu (server/, docs/sync-plan.md S2): PHP 8.4 + MariaDB 10.11 üzerinde
# php -l, göç ve protokol sözleşme testleri (npm run test:sync-server). S3'ten beri aynı
# sunucuya karşı masaüstü istemcisi: motorun sözleşme testleri ve gerçek Electron E2E'si.
# S7'den beri iki cihazlı senaryo matrisi (scripts/sync-e2e-matrix.mjs): gerçek Electron
# masaüstü, Playwright'ta mobil derleme ve aynı PHP sunucusu.
on:
    push:
        branches:
            - main
        paths:
            - 'server/**'
            - 'shared/sync-*'
            - 'docs/sync-protocol.md'
            - 'scripts/start-sync-test-server.mjs'
            - 'scripts/run-sync-server-tests.mjs'
            - 'tests/sync-server-*'
            - 'tests/sync-client-*'
            - 'main/functions/sync-client-*'
            - 'main/functions/task-store.js'
            - 'renderer/sync/**'
            - 'mobile/src/**'
            - 'mobile/package-lock.json'
            - 'mobile/tests/helpers/**'
            - 'scripts/generate-project-fixture.mjs'
            - 'renderer/tags/pisi-task-store.mjs'
            - 'renderer/tags/pisi-todo-second-release.mjs'
            - 'renderer/tags/pisi-source-of-truth.mjs'
            - 'main/functions/document-store-diary.js'
            - 'scripts/electron-sync-client-e2e.mjs'
            - 'scripts/sync-e2e-matrix.mjs'
            - 'scripts/sync-e2e/**'
            - 'scripts/sync-smoke.mjs'
            - 'preload.js'
            - '.cpanel.yml'
            - '.github/workflows/sync-server.yml'
    pull_request:
        paths:
            - 'server/**'
            - 'shared/sync-*'
            - 'docs/sync-protocol.md'
            - 'scripts/start-sync-test-server.mjs'
            - 'scripts/run-sync-server-tests.mjs'
            - 'tests/sync-server-*'
            - 'tests/sync-client-*'
            - 'main/functions/sync-client-*'
            - 'main/functions/task-store.js'
            - 'renderer/sync/**'
            - 'mobile/src/**'
            - 'mobile/package-lock.json'
            - 'mobile/tests/helpers/**'
            - 'scripts/generate-project-fixture.mjs'
            - 'renderer/tags/pisi-task-store.mjs'
            - 'renderer/tags/pisi-todo-second-release.mjs'
            - 'renderer/tags/pisi-source-of-truth.mjs'
            - 'main/functions/document-store-diary.js'
            - 'scripts/electron-sync-client-e2e.mjs'
            - 'scripts/sync-e2e-matrix.mjs'
            - 'scripts/sync-e2e/**'
            - 'scripts/sync-smoke.mjs'
            - 'preload.js'
            - '.cpanel.yml'
            - '.github/workflows/sync-server.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: sync-server-${{ github.ref }}
    cancel-in-progress: true

jobs:
    contract:
        runs-on: ubuntu-latest
        timeout-minutes: 55

        services:
            mariadb:
                image: mariadb:10.11
                env:
                    # Yalnız bu iş için açılan, dışarıya kapalı test veritabanı.
                    MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="healthcheck.sh --connect --innodb_initialized"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24

            - name: Setup PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo_mysql, json, mbstring, hash
                  coverage: none
                  tools: none

            # .htaccess davranış testi gerçek Apache 2.4 ister (tests/sync-server-contract-htaccess.test.mjs).
            - name: Apache
              run: test -x /usr/sbin/apache2 || (sudo apt-get update && sudo apt-get install -y apache2)

            - name: Versions
              run: |
                  php -v
                  php -m | grep -i -E '^(pdo_mysql|json|hash)$'
                  /usr/sbin/apache2 -v

            # Masaüstü E2E'si (scripts/electron-sync-client-e2e.mjs) Electron ikilisini ister.
            - name: Install dependencies with Electron
              run: npm ci

            # S7: the matrix's phone is the mobile build in Playwright's Chromium.
            - name: Install the mobile package
              run: npm --prefix mobile ci

            - name: Playwright Chromium for the matrix's phone
              working-directory: mobile
              run: npx playwright install --with-deps chromium

            # S6: tests/sync-server-contract-transfer.test.mjs measures the first upload and download of a
            # generated project at full size (2,000 notes, 5,000 tasks, 60 diary days, ~200 MB of images).
            - name: Contract tests (php -l, migrations, every endpoint and error code), first-transfer measurement, desktop E2E and the two-device matrix
              run: xvfb-run -a npm run test:sync-server
              env:
                  PISI_SYNC_TEST_DB_HOST: 127.0.0.1
                  PISI_SYNC_TEST_DB_PORT: '3306'
                  PISI_SYNC_TEST_DB_USER: root
                  PISI_SYNC_TEST_DB_PASSWORD: ''
                  PISI_SYNC_ELECTRON_E2E: '1'
                  PISI_SYNC_TRANSFER_FULL: '1'
                  PISI_SYNC_TRANSFER_REPORT: test-results/sync-initial-transfer.json
                  PISI_SYNC_MATRIX_E2E: '1'
                  PISI_SYNC_MATRIX_REPORT: test-results/sync-e2e-matrix.json

            - name: Upload the first-transfer measurement
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: sync-initial-transfer
                  path: test-results/sync-initial-transfer.json
                  if-no-files-found: warn

            - name: Upload the scenario matrix report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: sync-e2e-matrix
                  path: test-results/sync-e2e-matrix.json
                  if-no-files-found: warn
