name: Ship Pisi 0.9.0 Beta

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Ship Pisi 0.9.0 beta'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set beta version
        run: npm version 0.9.0 --no-git-tag-version

      - name: Validate source
        run: npm run validate

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Commit release version
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Set Pisi version 0.9.0"
          git push origin HEAD:main
          $releaseSha = git rev-parse HEAD
          "RELEASE_SHA=$releaseSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows packages
        run: npm run dist:win

      - name: Generate checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -File -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content dist/SHA256SUMS.txt

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          @"
          ## Pisi 0.9.0 Beta

          İlk public-beta adayı.

          ### Öne çıkanlar
          - Node ağacı, harita ve zengin metin çalışma alanı
          - Todo, Tags, Customize, Bloklar ve Links panelleri
          - Todo senkronizasyonu, Kanban ve görev bağımlılıkları
          - Workspace Center ve uygulama düzeyi Preferences
          - Dark ve Light tema desteği
          - Türkçe / İngilizce arayüz altyapısı
          - Windows installer ve portable paketler

          ### Doğrulama
          - Source validation, architecture, migration, i18n, lint ve test suite
          - npm audit: 0 bilinen vulnerability

          > Bu sürüm beta olarak işaretlenmiştir. Windows paketleri henüz code-signed değildir; bu nedenle Windows SmartScreen ilk çalıştırmada uyarı gösterebilir.
          "@ | Set-Content release-notes.md

          $assets = @(
            Get-ChildItem dist -File | Where-Object { $_.Extension -eq '.exe' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object { $_.FullName }
          )

          gh release create v0.9.0 @assets `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:RELEASE_SHA `
            --title "Pisi 0.9.0 Beta" `
            --notes-file release-notes.md `
            --prerelease
