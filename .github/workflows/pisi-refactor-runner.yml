name: Pisi refactor runner

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.issue.title == '[PISI-REFACTOR-RUN]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create clean refactor branch
        run: |
          git fetch origin main
          git checkout -B agent/full-pisi-internal-rename origin/main
          git config core.ignorecase false

      - name: Rename every Kedi reference
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path.cwd()
          workflow = root / '.github/workflows/pisi-refactor-runner.yml'
          ignored = {'.git', 'node_modules', 'dist', 'coverage', 'out', 'release'}

          def skipped(path: Path) -> bool:
              return any(part in ignored for part in path.parts)

          def rename_value(value: str) -> str:
              return (value
                      .replace('KEDI', 'PISI')
                      .replace('Kedi', 'Pisi')
                      .replace('kedi', 'pisi'))

          for path in sorted(root.rglob('*')):
              if not path.is_file() or skipped(path) or path == workflow:
                  continue
              raw = path.read_bytes()
              if b'\x00' in raw:
                  continue
              try:
                  text = raw.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              updated = rename_value(text)
              if updated != text:
                  path.write_bytes(updated.encode('utf-8'))

          paths = [path for path in root.rglob('*') if not skipped(path) and path != workflow]
          for path in sorted(paths, key=lambda item: len(item.parts), reverse=True):
              if not path.exists():
                  continue
              target_name = rename_value(path.name)
              if target_name == path.name:
                  continue
              target = path.with_name(target_name)
              if target.exists():
                  raise RuntimeError(f'Rename collision: {path} -> {target}')
              path.rename(target)

          if workflow.exists():
              workflow.unlink()

          leftovers = []
          for path in sorted(root.rglob('*')):
              if skipped(path):
                  continue
              relative = path.relative_to(root)
              if re.search('kedi', str(relative), re.IGNORECASE):
                  leftovers.append(f'path: {relative}')
              if not path.is_file():
                  continue
              raw = path.read_bytes()
              if b'\x00' in raw:
                  continue
              try:
                  text = raw.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              if re.search('kedi', text, re.IGNORECASE):
                  leftovers.append(f'content: {relative}')

          if leftovers:
              raise RuntimeError('Unconverted references remain:\n' + '\n'.join(leftovers))

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate renamed application
        run: npm run validate

      - name: Commit and push refactor branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Rename all Kedi internals to Pisi"
          git push --force origin HEAD:agent/full-pisi-internal-rename
