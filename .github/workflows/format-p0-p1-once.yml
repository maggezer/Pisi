name: Format P0 P1 Once

on:
    push:
        branches:
            - main
        paths:
            - .github/workflows/format-p0-p1-once.yml

permissions:
    contents: write

jobs:
    format:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: main

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Format changed files
              run: >
                  npx prettier
                  main/functions/project-operations.js
                  main/functions/relationship-store.js
                  main/module-manifest.json
                  tests/data-integrity.test.js
                  tests/source-of-truth.test.js
                  main/functions/filesystem-core.js
                  main/functions/document-store-metadata.js
                  main/functions/sync-project-adapter.js
                  main/functions/path-security.js
                  --write

            - name: Commit formatting
              run: |
                  if git diff --quiet; then
                    echo "No formatting changes needed."
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add main/functions/project-operations.js \
                          main/functions/relationship-store.js \
                          main/module-manifest.json \
                          tests/data-integrity.test.js \
                          tests/source-of-truth.test.js \
                          main/functions/filesystem-core.js \
                          main/functions/document-store-metadata.js \
                          main/functions/sync-project-adapter.js \
                          main/functions/path-security.js
                  git commit -m "Format P0 P1 cleanup"
                  git push origin HEAD:main
