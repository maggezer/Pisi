name: Apply table overhaul

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/sheet-overhaul'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/sheet-overhaul
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Apply table overhaul
        run: |
          node --check scripts/apply-sheet-overhaul.js
          node scripts/apply-sheet-overhaul.js

      - name: Validate project
        run: npm run validate

      - name: Remove one-time files
        run: |
          rm -rf .tmp-sheet-overhaul
          rm -f scripts/apply-sheet-overhaul.js
          rm -f .github/workflows/apply-sheet-overhaul.yml

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Overhaul table editing and navigation"
            git push origin HEAD:agent/sheet-overhaul
          fi
