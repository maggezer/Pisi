name: Electron E2E

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:
        inputs:
            macos:
                description: 'macOS (macos-latest) üzerinde de koş'
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    electron-smoke-e2e:
        name: electron-smoke-e2e (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                # ubuntu-latest runs under xvfb; windows-latest runs with its own desktop session.
                # macOS is optional: only a manual run with the "macos" input adds it.
                os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.macos && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 25
        defaults:
            run:
                shell: bash

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - name: Install full Electron dependencies
              run: npm ci

            - name: Run Electron E2E suite (xvfb)
              if: runner.os == 'Linux'
              run: xvfb-run -a npm run test:e2e

            - name: Run Electron E2E suite
              if: runner.os != 'Linux'
              run: npm run test:e2e

            # Report only: map performance numbers never fail the build.
            - name: Map performance report
              if: always() && runner.os == 'Linux'
              continue-on-error: true
              env:
                  PISI_PERF_REPORT_ONLY: '1'
                  PISI_PERF_FRAMES: '30'
                  PISI_PERF_OUTPUT: map-performance
              run: |
                  xvfb-run -a node scripts/electron-map-performance-e2e.mjs
                  if [ -f map-performance/pisi-map-performance.md ]; then
                      { echo '## Map performance (report only)'; cat map-performance/pisi-map-performance.md; } >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Upload map performance report
              if: always() && runner.os == 'Linux'
              continue-on-error: true
              uses: actions/upload-artifact@v4
              with:
                  name: map-performance
                  path: map-performance/
                  if-no-files-found: ignore
