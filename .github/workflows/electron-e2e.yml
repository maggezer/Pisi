name: Electron E2E

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    electron-smoke-e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 8

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - name: Install full Electron dependencies
              run: npm ci

            - name: Run Electron E2E suite
              run: xvfb-run -a npm run test:e2e
