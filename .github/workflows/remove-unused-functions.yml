name: Remove unused functions

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/remove-unused-functions'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-unused-functions
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Remove confirmed unused function declarations
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const espree = require('espree');

          const targets = new Map([
            ['main.js', [
              'getConnectionRoleFromPort',
              'getEdgeVisualTypeFromRoles',
              'getNodeDocByIdInMap'
            ]],
            ['renderer/pisi-tree.js', [
              'getDirectTreeRow',
              'updateTreeAfterSavedConnection',
              'updateMapBoxAfterRename',
              'getEditableBaseName'
            ]],
            ['renderer/pisi-map-workspace.js', [
              'getBaseName'
            ]]
          ]);

          for (const [filePath, names] of targets) {
            let source = fs.readFileSync(filePath, 'utf8');
            const ast = espree.parse(source, {
              ecmaVersion: 'latest',
              sourceType: 'script',
              range: true,
              allowHashBang: true
            });

            const matches = ast.body.filter((node) => {
              return node.type === 'FunctionDeclaration' && names.includes(node.id?.name);
            });

            for (const name of names) {
              const count = matches.filter((node) => node.id?.name === name).length;
              if (count !== 1) {
                throw new Error(`${filePath}: ${name} için beklenen 1 tanım yerine ${count} tanım bulundu.`);
              }
            }

            for (const node of matches.sort((a, b) => b.range[0] - a.range[0])) {
              source = source.slice(0, node.range[0]) + source.slice(node.range[1]);
            }

            source = source.replace(/\n{3,}/g, '\n\n');
            fs.writeFileSync(filePath, source, 'utf8');
          }
          NODE

      - name: Remove one-time workflow
        run: rm .github/workflows/remove-unused-functions.yml

      - name: Verify removed names are absent
        shell: bash
        run: |
          if grep -RInE --include='*.js' \
            'getConnectionRoleFromPort|getEdgeVisualTypeFromRoles|getNodeDocByIdInMap|getDirectTreeRow|updateTreeAfterSavedConnection|updateMapBoxAfterRename|getEditableBaseName|function getBaseName' \
            main.js renderer; then
            echo 'Silinmesi gereken kullanılmayan fonksiyon adı hâlâ mevcut.' >&2
            exit 1
          fi

      - name: Validate project
        run: npm run validate

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.js renderer/pisi-tree.js renderer/pisi-map-workspace.js .github/workflows/remove-unused-functions.yml
          git commit -m 'Remove unused helper functions'
          git push origin HEAD:agent/remove-unused-functions
