name: Apply todo priority and date picker

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/todo-priority-date-picker'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/todo-priority-date-picker
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Apply todo picker changes
        run: node scripts/apply-todo-picker.js

      - name: Normalize regression assertion
        run: |
          node <<'NODE'
          const fs = require('fs');
          const filePath = 'tests/todo-tag.test.js';
          let source = fs.readFileSync(filePath, 'utf8');
          source = source.replace(
            "assert.match(editorSource, /isPisiTodoCommand(command)/);",
            "assert.ok(editorSource.includes('isPisiTodoCommand(command)'));"
          );
          fs.writeFileSync(filePath, source, 'utf8');
          NODE

      - name: Validate project
        run: npm run validate

      - name: Remove one-time files
        run: |
          rm -f scripts/apply-todo-picker.js
          rm -f .github/workflows/apply-todo-picker.yml

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add guided todo priority and date picker"
            git push origin HEAD:agent/todo-priority-date-picker
          fi
