name: Fix diary folder migration

on:
  push:
    branches:
      - main
    paths:
      - .github/diary-fix-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply safe diary migration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          operations_path = Path('main/functions/project-operations.js')
          operations = operations_path.read_text(encoding='utf-8')
          old_marker_check = """    if (fs.existsSync(path.join(folderPath, '.pisi-diary'))) {
                  return true;
              }
          """
          new_marker_check = """    if (
                  fs.existsSync(path.join(folderPath, '.pisi-diary')) ||
                  fs.existsSync(path.join(folderPath, '.kedi-diary'))
              ) {
                  return true;
              }
          """
          if old_marker_check not in operations:
              raise SystemExit('Diary marker check fragment was not found.')
          operations = operations.replace(old_marker_check, new_marker_check, 1)
          operations_path.write_text(operations, encoding='utf-8')

          store_path = Path('main/functions/document-store.js')
          store = store_path.read_text(encoding='utf-8')
          old_guard = """    if (
                  fs.existsSync(diaryFolder) &&
                  !isPisiManagedDiaryFolder(diaryFolder)
              ) {
                  return {
                      ok: false,
                      error: 'Projedeki mevcut \"diary\" klasörü PISI tarafından yönetilmiyor. Kullanıcı klasörünü korumak için işlem durduruldu.'
                  };
              }
          """
          new_guard = """    if (fs.existsSync(diaryFolder)) {
                  const diaryStat = fs.statSync(diaryFolder);

                  if (!diaryStat.isDirectory()) {
                      return {
                          ok: false,
                          error: 'Projedeki mevcut \"diary\" yolu bir klasör değil. Kullanıcı verisini korumak için işlem durduruldu.'
                      };
                  }

                  const diaryFolderIsEmpty = fs.readdirSync(diaryFolder).length === 0;

                  if (!diaryFolderIsEmpty && !isPisiManagedDiaryFolder(diaryFolder)) {
                      return {
                          ok: false,
                          error: 'Projedeki mevcut \"diary\" klasörü PISI tarafından yönetilmiyor. Kullanıcı klasörünü korumak için işlem durduruldu.'
                      };
                  }
              }
          """
          if old_guard not in store:
              raise SystemExit('Diary safety guard fragment was not found.')
          store = store.replace(old_guard, new_guard, 1)
          store_path.write_text(store, encoding='utf-8')

          tests_path = Path('tests/data-integrity.test.js')
          tests = tests_path.read_text(encoding='utf-8')
          old_context = """        markInternalFileChange() {},
                  writeFileAtomic(filePath, content) {
          """
          new_context = """        markInternalFileChange() {},
                  sealInternalFileChange() {},
                  writeFileAtomic(filePath, content) {
          """
          if old_context not in tests:
              raise SystemExit('Test helper context fragment was not found.')
          tests = tests.replace(old_context, new_context, 1)

          insertion_point = """test('watcher PISI kaydını dış değişiklikten dosya imzasıyla ayırır', (t) => {
          """
          migration_test = r"""test('boş ve eski işaretçili diary klasörleri güvenle Pisi yönetimine alınır', (t) => {
              const projectFolders = [];
              t.after(() => {
                  for (const folder of projectFolders) {
                      fs.rmSync(folder, { recursive: true, force: true });
                  }
              });

              const api = loadMainHelpers([
                  'normalizePisiDiaryIsoDate',
                  'readJsonFileResult',
                  'isPisiManagedDiaryFolder',
                  'ensurePisiDiaryFolder'
              ], [
                  'ensurePisiDiaryFolder'
              ]);

              const emptyProject = fs.mkdtempSync(
                  path.join(os.tmpdir(), 'pisi-empty-diary-')
              );
              projectFolders.push(emptyProject);
              const emptyDiary = path.join(emptyProject, 'diary');
              fs.mkdirSync(emptyDiary);

              const emptyResult = api.ensurePisiDiaryFolder(emptyProject);
              assert.equal(emptyResult.ok, true);
              assert.equal(
                  fs.existsSync(path.join(emptyDiary, '.pisi-diary')),
                  true
              );

              const legacyProject = fs.mkdtempSync(
                  path.join(os.tmpdir(), 'pisi-legacy-diary-')
              );
              projectFolders.push(legacyProject);
              const legacyDiary = path.join(legacyProject, 'diary');
              fs.mkdirSync(legacyDiary);
              fs.writeFileSync(
                  path.join(legacyDiary, '.kedi-diary'),
                  'legacy marker',
                  'utf8'
              );

              const legacyResult = api.ensurePisiDiaryFolder(legacyProject);
              assert.equal(legacyResult.ok, true);
              assert.equal(
                  fs.existsSync(path.join(legacyDiary, '.pisi-diary')),
                  true
              );
              assert.equal(
                  fs.readFileSync(path.join(legacyDiary, '.kedi-diary'), 'utf8'),
                  'legacy marker'
              );
          });

          """
          if insertion_point not in tests:
              raise SystemExit('Diary migration test insertion point was not found.')
          tests = tests.replace(insertion_point, migration_test + insertion_point, 1)
          tests_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate project
        run: npm run validate

      - name: Remove one-time files
        run: |
          rm -f .github/diary-fix-trigger
          rm -f .github/workflows/fix-diary-migration.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/functions/project-operations.js main/functions/document-store.js tests/data-integrity.test.js .github
          git commit -m "Migrate safe legacy diary folders"
          git push origin HEAD:main
