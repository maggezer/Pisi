name: Publish Pisi v0.11.0

on:
    push:
        branches:
            - chatgpt/tag-v0.11.0-20260820
        paths:
            - .github/workflows/tag-v0.11.0.yml

permissions:
    contents: write

jobs:
    release:
        runs-on: windows-latest
        timeout-minutes: 60
        env:
            TARGET_SHA: c49c7a415cfdfb84d8af1b41ae771d527ee34c83
            RELEASE_TAG: v0.11.0
            HELPER_BRANCH: chatgpt/tag-v0.11.0-20260820

        steps:
            - name: Checkout release commit
              uses: actions/checkout@v4
              with:
                  ref: c49c7a415cfdfb84d8af1b41ae771d527ee34c83
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Verify release metadata and retag unpublished release target
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  $version = node -p "require('./package.json').version"
                  if ($version -ne '0.11.0') {
                    throw "Expected package version 0.11.0, found $version"
                  }
                  if (-not (Test-Path 'docs/releases/v0.11.0.md')) {
                    throw 'Missing docs/releases/v0.11.0.md'
                  }

                  git fetch origin main --tags
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git rev-parse --verify --quiet refs/tags/v0.11.0 | Out-Null
                  if ($LASTEXITCODE -eq 0) {
                    $tagCommit = (git rev-list -n 1 v0.11.0).Trim()
                    if ($tagCommit -ne $env:TARGET_SHA) {
                      gh release view v0.11.0 *> $null
                      if ($LASTEXITCODE -eq 0) {
                        throw "Refusing to move v0.11.0 because a GitHub release already exists."
                      }
                      git push origin :refs/tags/v0.11.0
                      git tag -d v0.11.0
                    }
                  }

                  git rev-parse --verify --quiet refs/tags/v0.11.0 | Out-Null
                  if ($LASTEXITCODE -ne 0) {
                    git tag -a v0.11.0 $env:TARGET_SHA -m "Pisi 0.11.0 Beta"
                    git push origin refs/tags/v0.11.0
                  }

                  $finalTagCommit = (git rev-list -n 1 v0.11.0).Trim()
                  if ($finalTagCommit -ne $env:TARGET_SHA) {
                    throw "v0.11.0 tag points to $finalTagCommit instead of $env:TARGET_SHA"
                  }

            - name: Install dependencies
              run: npm ci

            - name: Validate source
              run: npm run validate

            - name: Audit dependencies
              run: npm run audit

            - name: Build Windows installers
              run: npm run dist:installer -- --x64 --arm64 --publish never

            - name: Collect installer assets
              shell: pwsh
              run: |
                  $version = '0.11.0'
                  New-Item -ItemType Directory -Force release | Out-Null
                  $targets = @(
                    @{ Arch = 'x64'; Source = "dist/Pisi-$version-win-x64.exe" },
                    @{ Arch = 'arm64'; Source = "dist/Pisi-$version-win-arm64.exe" }
                  )
                  foreach ($target in $targets) {
                    if (-not (Test-Path $target.Source)) { throw "Missing installer build: $($target.Source)" }
                    Copy-Item $target.Source "release/Pisi-$version-Setup-$($target.Arch).exe"
                  }
                  Remove-Item 'dist/*.exe' -Force -ErrorAction SilentlyContinue

            - name: Build Windows portable packages
              run: npm run dist:portable -- --x64 --arm64 --publish never

            - name: Collect portable assets and checksums
              shell: pwsh
              run: |
                  $version = '0.11.0'
                  $targets = @(
                    @{ Arch = 'x64'; Source = "dist/Pisi-$version-win-x64.exe" },
                    @{ Arch = 'arm64'; Source = "dist/Pisi-$version-win-arm64.exe" }
                  )
                  foreach ($target in $targets) {
                    if (-not (Test-Path $target.Source)) { throw "Missing portable build: $($target.Source)" }
                    Copy-Item $target.Source "release/Pisi-$version-Portable-$($target.Arch).exe"
                  }
                  $assetNames = @(
                    "Pisi-$version-Setup-x64.exe",
                    "Pisi-$version-Setup-arm64.exe",
                    "Pisi-$version-Portable-x64.exe",
                    "Pisi-$version-Portable-arm64.exe"
                  )
                  $hashLines = foreach ($assetName in $assetNames) {
                    $assetPath = Join-Path release $assetName
                    if (-not (Test-Path $assetPath)) { throw "Missing release asset: $assetPath" }
                    $hash = (Get-FileHash -Algorithm SHA256 $assetPath).Hash.ToLowerInvariant()
                    "$hash  $assetName"
                  }
                  $hashLines | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt

            - name: Publish GitHub beta release
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  $assets = @(
                    'release/Pisi-0.11.0-Setup-x64.exe',
                    'release/Pisi-0.11.0-Setup-arm64.exe',
                    'release/Pisi-0.11.0-Portable-x64.exe',
                    'release/Pisi-0.11.0-Portable-arm64.exe',
                    'release/SHA256SUMS.txt'
                  )

                  gh release view v0.11.0 *> $null
                  if ($LASTEXITCODE -eq 0) {
                    gh release upload v0.11.0 @assets --clobber
                    if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release assets.' }
                    gh release edit v0.11.0 --title 'Pisi 0.11.0 Beta' --notes-file 'docs/releases/v0.11.0.md' --prerelease
                    if ($LASTEXITCODE -ne 0) { throw 'Failed to update release metadata.' }
                  } else {
                    gh release create v0.11.0 @assets --title 'Pisi 0.11.0 Beta' --notes-file 'docs/releases/v0.11.0.md' --prerelease
                    if ($LASTEXITCODE -ne 0) { throw 'Failed to create GitHub release.' }
                  }

            - name: Record final release status
              if: always()
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
                  JOB_STATUS: ${{ job.status }}
              run: |
                  $releaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v0.11.0"
                  $status = "status=$env:JOB_STATUS`ntag=v0.11.0`ntarget=$env:TARGET_SHA`nurl=$releaseUrl`n"
                  $bytes = [System.Text.Encoding]::UTF8.GetBytes($status)
                  $content = [Convert]::ToBase64String($bytes)
                  gh api --method PUT "repos/$env:GITHUB_REPOSITORY/contents/.release-status-v0.11.0-final.txt" `
                    -f message='Record final v0.11.0 release status' `
                    -f content="$content" `
                    -f branch="$env:HELPER_BRANCH"
