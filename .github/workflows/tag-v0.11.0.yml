name: Tag Pisi v0.11.0

on:
  push:
    branches:
      - chatgpt/tag-v0.11.0-20260820
    paths:
      - .github/workflows/tag-v0.11.0.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag on main
        shell: bash
        run: |
          git fetch origin main --tags
          if git ls-remote --exit-code --tags origin refs/tags/v0.11.0 >/dev/null 2>&1; then
            echo "Tag v0.11.0 already exists; refusing to move it." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.11.0 origin/main -m "Pisi 0.11.0 Beta"
          git push origin refs/tags/v0.11.0
