name: Apply Todo navigation and filter fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-todo-navigation-filter
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Repair codemod escaping
        run: node scripts/fix-todo-codemod-syntax.js

      - name: Check codemod syntax
        run: |
          node --check scripts/apply-todo-navigation-filter-fix.js
          node --check scripts/refactor-todo-navigation-module.js

      - name: Apply source changes
        run: |
          node scripts/apply-todo-navigation-filter-fix.js
          node scripts/refactor-todo-navigation-module.js

      - name: Install dependencies without Electron binary
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Validate source
        run: npm run validate

      - name: Remove one-time files
        run: |
          rm -f scripts/apply-todo-navigation-filter-fix.js
          rm -f scripts/fix-todo-codemod-syntax.js
          rm -f scripts/refactor-todo-navigation-module.js
          rm -f .github/workflows/apply-todo-navigation-filter-fix.yml

      - name: Commit Todo fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Todo source highlighting and date filter menu"
          git push origin agent/fix-todo-navigation-filter
