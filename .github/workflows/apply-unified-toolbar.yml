name: Apply unified toolbar

on:
  push:
    branches:
      - agent/unified-office-toolbar
    paths:
      - scripts/apply-unified-toolbar.js
      - .github/workflows/apply-unified-toolbar.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/unified-office-toolbar
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without Electron binary
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Apply unified toolbar changes
        run: node scripts/apply-unified-toolbar.js

      - name: Validate source
        run: npm run validate

      - name: Remove one-time automation
        run: |
          rm scripts/apply-unified-toolbar.js
          rm .github/workflows/apply-unified-toolbar.yml

      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement unified Office-style toolbar"
          git push origin agent/unified-office-toolbar

# Triggered after all toolbar source modules were staged.
