name: Apply current toolbar polish

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout toolbar branch
        uses: actions/checkout@v4
        with:
          ref: agent/polish-current-toolbar
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prepare codemod template
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/apply-current-toolbar-polish.js')
          source = path.read_text(encoding='utf-8')
          token = 'const toolbarHead = String.raw`'
          start = source.index(token) + len(token)
          end = source.index('`;\n\nconst toolbarCss = String.raw`', start)
          inner = source[start:end].replace('`', '\\`')
          path.write_text(source[:start] + inner + source[end:], encoding='utf-8')

      - name: Validate codemod syntax
        run: node --check scripts/apply-current-toolbar-polish.js

      - name: Install dependencies without Electron binary
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Apply toolbar polish
        run: node scripts/apply-current-toolbar-polish.js

      - name: Validate source
        run: npm run validate

      - name: Remove one-time automation
        run: |
          rm scripts/apply-current-toolbar-polish.js
          rm .github/workflows/apply-current-toolbar-polish.yml

      - name: Commit polished toolbar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish current toolbar with custom icons"
          git push origin agent/polish-current-toolbar
