name: Fix Todo recurrence local date

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/todo-second-release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Todo second release branch
        uses: actions/checkout@v4
        with:
          ref: agent/todo-second-release
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply local-date recurrence fix
        run: |
          node --check scripts/fix-todo-repeat-local-date.js
          node scripts/fix-todo-repeat-local-date.js

      - name: Install dependencies without Electron binary
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Validate source
        run: npm run validate

      - name: Remove one-time fix files
        run: |
          rm -f scripts/fix-todo-repeat-local-date.js
          rm -f .github/workflows/fix-todo-repeat-local-date.yml

      - name: Commit recurrence date fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use local dates for recurring Todo tasks"
          git push origin agent/todo-second-release
