name: Formatter Baseline Preview

on:
    push:
        branches:
            - main
        paths:
            - 'package.json'
            - 'package-lock.json'
            - '.prettierrc.json'
            - '.prettierignore'
            - '.github/workflows/formatter-baseline-preview.yml'
            - 'scripts/**'
            - 'tests/**'
            - 'main/**'
            - 'renderer/**'
            - 'styles/**'
            - 'style.css'
            - 'preload.js'
            - 'main.js'

permissions:
    contents: read

jobs:
    format-preview:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies without Electron binary
              env:
                  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
              run: npm ci --ignore-scripts

            - name: Apply repository-wide Prettier baseline
              run: npm run format

            - name: Validate formatted source
              run: npm run validate

            - name: Emit formatter baseline transfer batches
              shell: bash
              run: |
                  node <<'NODE'
                  const fs = require('node:fs');
                  const zlib = require('node:zlib');
                  const { execFileSync } = require('node:child_process');

                  const paths = execFileSync(
                    'git',
                    ['diff', '--name-only', '-z'],
                    { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 }
                  ).split('\0').filter(Boolean);

                  const batches = [];
                  let current = [];
                  let currentBytes = 0;
                  const targetBytes = 110 * 1024;

                  for (const path of paths) {
                    if (!fs.existsSync(path) || fs.statSync(path).isDirectory()) continue;
                    const content = fs.readFileSync(path, 'utf8');
                    const itemBytes = Buffer.byteLength(content, 'utf8');

                    if (current.length && currentBytes + itemBytes > targetBytes) {
                      batches.push(current);
                      current = [];
                      currentBytes = 0;
                    }

                    current.push([path, content]);
                    currentBytes += itemBytes;
                  }

                  if (current.length) batches.push(current);

                  console.log('PISI_PRETTIER_BATCH_COUNT=' + batches.length);
                  batches.forEach((batch, index) => {
                    const json = JSON.stringify(batch);
                    const encoded = zlib.deflateSync(Buffer.from(json, 'utf8'), { level: 9 }).toString('base64');
                    const key = String(index).padStart(3, '0');
                    console.log('PISI_PRETTIER_BATCH_' + key + '=' + encoded);
                  });
                  NODE
