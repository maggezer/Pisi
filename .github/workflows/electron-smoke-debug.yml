name: Electron Smoke Debug

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  electron-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install full Electron dependencies
        run: npm ci

      - name: Launch Electron and capture renderer startup
        shell: bash
        run: |
          set +e
          ELECTRON_ENABLE_LOGGING=1 timeout 15s xvfb-run -a npm start -- --enable-logging=stderr > electron-smoke.log 2>&1
          status=$?
          set -e
          cat electron-smoke.log
          if grep -Eiq "Uncaught|ReferenceError|TypeError|SyntaxError|ERR_MODULE_NOT_FOUND|Renderer process crashed|Failed to load resource" electron-smoke.log; then
            echo "Renderer startup error detected."
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "Electron exited unexpectedly with status $status"
            exit "$status"
          fi
