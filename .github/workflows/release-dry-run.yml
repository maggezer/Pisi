name: Release Dry Run

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-dry-run.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify package release metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          notes="docs/releases/v$version.md"
          test -f "$notes" || {
            echo "Missing release notes: $notes" >&2
            exit 1
          }

      - name: Install dependencies without Electron binary
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Require clean dependency audit
        run: npm audit --audit-level=moderate

      - name: Validate source
        run: npm run validate

  windows-package:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers
        run: npm run dist:installer -- --x64 --arm64 --publish never

      - name: Collect installer assets
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force release | Out-Null

          $targets = @(
            @{ Arch = 'x64'; Source = "dist/Pisi-$version-win-x64.exe" },
            @{ Arch = 'arm64'; Source = "dist/Pisi-$version-win-arm64.exe" }
          )

          foreach ($target in $targets) {
            if (-not (Test-Path $target.Source)) {
              throw "Missing installer build: $($target.Source)"
            }
            Copy-Item $target.Source "release/Pisi-$version-Setup-$($target.Arch).exe"
          }

          Remove-Item 'dist/*.exe' -Force -ErrorAction SilentlyContinue

      - name: Build Windows portable packages
        run: npm run dist:portable -- --x64 --arm64 --publish never

      - name: Collect portable assets and checksums
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"

          $targets = @(
            @{ Arch = 'x64'; Source = "dist/Pisi-$version-win-x64.exe" },
            @{ Arch = 'arm64'; Source = "dist/Pisi-$version-win-arm64.exe" }
          )

          foreach ($target in $targets) {
            if (-not (Test-Path $target.Source)) {
              throw "Missing portable build: $($target.Source)"
            }
            Copy-Item $target.Source "release/Pisi-$version-Portable-$($target.Arch).exe"
          }

          $assetNames = @(
            "Pisi-$version-Setup-x64.exe",
            "Pisi-$version-Setup-arm64.exe",
            "Pisi-$version-Portable-x64.exe",
            "Pisi-$version-Portable-arm64.exe"
          )

          $hashLines = foreach ($assetName in $assetNames) {
            $assetPath = Join-Path release $assetName
            if (-not (Test-Path $assetPath)) {
              throw "Missing release asset: $assetPath"
            }
            $hash = (Get-FileHash -Algorithm SHA256 $assetPath).Hash.ToLowerInvariant()
            "$hash  $assetName"
          }

          $hashLines | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt

      - name: Upload dry-run release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pisi-release-dry-run-Windows
          path: release/*
          if-no-files-found: error
