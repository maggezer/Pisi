name: P3.9 Unused Helper Audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit unused variables and helpers
        run: |
          npx eslint main.mjs "main/**/*.js" "renderer/**/*.mjs"             --rule 'no-unused-vars:["error",{"args":"after-used","argsIgnorePattern":"^_","caughtErrors":"none","ignoreRestSiblings":true}]'
