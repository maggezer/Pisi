name: Prepare Pisi 0.11.0

on:
  push:
    branches:
      - release/0.11.0
    paths:
      - .github/workflows/prepare-release-0.11.0.yml

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set release version
        run: npm version 0.11.0 --no-git-tag-version --allow-same-version

      - name: Commit version files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          git commit -m "Prepare Pisi 0.11.0 Beta version"
          git push
