name: Fix editor enter and initial caret

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/fix-editor-enter-caret'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-editor-enter-caret
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply editor caret fix
        run: node scripts/fix-editor-enter-caret.cjs

      - name: Validate project
        run: npm run validate

      - name: Remove one-time files
        run: |
          rm -f scripts/fix-editor-enter-caret.cjs
          rm -f .github/editor-enter-trigger
          rm -f .github/workflows/fix-editor-enter.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renderer/tags/pisi-tag-index.mjs renderer/editor/pisi-node-editor.mjs tests/source-invariants.test.js scripts .github
          git commit -m "Fix editor new lines and initial caret"
          git push origin HEAD:agent/fix-editor-enter-caret
