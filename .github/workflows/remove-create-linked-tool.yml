name: Remove Create Linked Tool

on:
  push:
    branches:
      - chatgpt/remove-create-linked-tool-20260820
    paths:
      - .github/workflows/remove-create-linked-tool.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt/remove-create-linked-tool-20260820

      - name: Remove Create Linked Tool button wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('renderer/map/pisi-map-operational.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "    const linked = document.getElementById('pisi-map-operational-linked');\n    if (focus) focus.disabled = !selected;\n    if (linked) linked.disabled = !selected;",
                  "    if (focus) focus.disabled = !selected;"
              ),
              (
                  "        ['pisi-map-operational-next', 'next'],\n        ['pisi-map-operational-linked', 'linked'],\n        ['pisi-map-operational-deps', 'deps'],",
                  "        ['pisi-map-operational-next', 'next'],\n        ['pisi-map-operational-deps', 'deps'],"
              ),
              (
                  "        'focus', 'next', 'linked', 'deps', 'labels', 'work',",
                  "        'focus', 'next', 'deps', 'labels', 'work',"
              ),
              (
                  "        buttons.focus, buttons.next, buttons.linked,\n        buttons.deps, buttons.labels, buttons.work,",
                  "        buttons.focus, buttons.next,\n        buttons.deps, buttons.labels, buttons.work,"
              ),
              (
                  "    document.getElementById('pisi-map-operational-next')?.addEventListener('click', focusNextPisiOperationalNode);\n    document.getElementById('pisi-map-operational-linked')?.addEventListener('click', createPisiOperationalLinkedNode);\n    document.getElementById('pisi-map-operational-deps')?.addEventListener('click', () => togglePisiOperationalDisplay('showTaskDependencies'));",
                  "    document.getElementById('pisi-map-operational-next')?.addEventListener('click', focusNextPisiOperationalNode);\n    document.getElementById('pisi-map-operational-deps')?.addEventListener('click', () => togglePisiOperationalDisplay('showTaskDependencies'));"
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- renderer/map/pisi-map-operational.mjs
          git commit -m "Remove Create Linked Tool button"
          git push
