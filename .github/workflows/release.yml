name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expectedTag = "v$version"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Release tag ${{ github.ref_name }} does not match package.json version $version (expected $expectedTag)."
          }
          if (-not (Test-Path "docs/releases/$expectedTag.md")) {
            throw "Missing release notes: docs/releases/$expectedTag.md"
          }

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run validate

      - name: Audit dependencies
        run: npm run audit

      - name: Build Windows installers
        run: npm run dist:installer -- --x64 --arm64

      - name: Collect installer assets
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force release | Out-Null

          $targets = @(
            @{ Arch = 'x64'; Source = "dist/Pisi-$version-win-x64.exe" },
            @{ Arch = 'arm64'; Source = "dist/Pisi-$version-win-arm64.exe" }
          )

          foreach ($target in $targets) {
            if (-not (Test-Path $target.Source)) {
              throw "Missing installer build: $($target.Source)"
            }
            Copy-Item $target.Source "release/Pisi-$version-Setup-$($target.Arch).exe"
          }

          Remove-Item 'dist/*.exe' -Force -ErrorAction SilentlyContinue

      - name: Build Windows portable packages
        run: npm run dist:portable -- --x64 --arm64

      - name: Collect portable assets and checksums
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"

          $targets = @(
            @{ Arch = 'x64'; Source = "dist/Pisi-$version-win-x64.exe" },
            @{ Arch = 'arm64'; Source = "dist/Pisi-$version-win-arm64.exe" }
          )

          foreach ($target in $targets) {
            if (-not (Test-Path $target.Source)) {
              throw "Missing portable build: $($target.Source)"
            }
            Copy-Item $target.Source "release/Pisi-$version-Portable-$($target.Arch).exe"
          }

          $assetNames = @(
            "Pisi-$version-Setup-x64.exe",
            "Pisi-$version-Setup-arm64.exe",
            "Pisi-$version-Portable-x64.exe",
            "Pisi-$version-Portable-arm64.exe"
          )

          $hashLines = foreach ($assetName in $assetNames) {
            $assetPath = Join-Path release $assetName
            if (-not (Test-Path $assetPath)) {
              throw "Missing release asset: $assetPath"
            }
            $hash = (Get-FileHash -Algorithm SHA256 $assetPath).Hash.ToLowerInvariant()
            "$hash  $assetName"
          }

          $hashLines | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt

      - name: Publish GitHub beta release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          gh release create "v$version" `
            "release/Pisi-$version-Setup-x64.exe" `
            "release/Pisi-$version-Setup-arm64.exe" `
            "release/Pisi-$version-Portable-x64.exe" `
            "release/Pisi-$version-Portable-arm64.exe" `
            "release/SHA256SUMS.txt" `
            --title "Pisi $version Beta" `
            --notes-file "docs/releases/v$version.md" `
            --prerelease
