name: Validate Pisi Tutorial

on:
  push:
    branches:
      - chatgpt/add-tutorial-20260820
    paths:
      - .github/workflows/validate-tutorial.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt/add-tutorial-20260820

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - id: install
        name: Install dependencies
        continue-on-error: true
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - id: validate
        name: Validate
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run validate > tutorial-validation.log 2>&1
          code=$?
          cat tutorial-validation.log
          exit $code

      - name: Record status and log
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL: ${{ steps.install.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
        run: |
          printf 'install=%s\nvalidate=%s\n' "$INSTALL" "$VALIDATE" > tutorial-validation.txt
          if [ ! -f tutorial-validation.log ]; then
            echo 'validation log unavailable' > tutorial-validation.log
          fi
          for pair in '.tutorial-validation.txt:tutorial-validation.txt' '.tutorial-validation.log:tutorial-validation.log'; do
            dest=${pair%%:*}
            src=${pair##*:}
            content=$(base64 -w0 "$src")
            sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$dest?ref=chatgpt/add-tutorial-20260820" --jq '.sha' 2>/dev/null || true)
            args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$dest" -f message="Record $dest" -f content="$content" -f branch='chatgpt/add-tutorial-20260820')
            if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
            gh api "${args[@]}"
          done
