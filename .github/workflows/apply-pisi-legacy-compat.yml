name: Apply Pisi legacy compatibility

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/audit-pisi-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/audit-pisi-migration
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply legacy data compatibility
        run: node scripts/apply-pisi-legacy-compat.cjs

      - name: Run strict migration audit
        run: npm run check:migration

      - name: Validate project
        run: npm run validate

      - name: Remove one-time files
        run: |
          rm -f scripts/apply-pisi-legacy-compat.cjs
          rm -f .github/workflows/apply-pisi-legacy-compat.yml

      - name: Commit verified compatibility fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/functions/document-store.js main/functions/path-security.js main/functions/electron-ipc.js scripts/check-pisi-migration.js tests/pisi-legacy-migration.test.js scripts .github
          git commit -m "Migrate legacy Kedi data safely to Pisi"
          git push origin HEAD:agent/audit-pisi-migration
