name: Cross-platform Packaging Smoke

on:
    push:
        branches:
            - main
        paths:
            - 'package.json'
            - 'package-lock.json'
            - 'build/**'
            - '.github/workflows/release.yml'
            - '.github/workflows/packaging-smoke.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: packaging-smoke-${{ github.ref }}
    cancel-in-progress: true

jobs:
    windows-package:
        runs-on: windows-latest
        timeout-minutes: 45
        env:
            CSC_IDENTITY_AUTO_DISCOVERY: 'false'

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Verify Windows packaging smoke contract
              run: node --test tests/cross-platform-packaging-smoke.test.js

            - name: Build unsigned Windows NSIS packages
              shell: pwsh
              run: |
                  npm run dist:installer -- --x64 --arm64 --publish never -c.extraMetadata.pisiDistribution=nsis

                  if ($LASTEXITCODE -ne 0) {
                    exit $LASTEXITCODE
                  }

            - name: Verify and stage Windows NSIS packages
              shell: pwsh
              run: |
                  $version = node -p "require('./package.json').version"
                  New-Item -ItemType Directory -Force smoke-windows | Out-Null

                  $targets = @(
                    @{ Arch = 'x64'; Source = "dist/Pisi-$version-win-x64.exe" },
                    @{ Arch = 'arm64'; Source = "dist/Pisi-$version-win-arm64.exe" }
                  )

                  foreach ($target in $targets) {
                    if (-not (Test-Path -LiteralPath $target.Source -PathType Leaf)) {
                      throw "Missing NSIS smoke artifact: $($target.Source)"
                    }

                    $item = Get-Item -LiteralPath $target.Source
                    if ($item.Length -le 0) {
                      throw "Empty NSIS smoke artifact: $($target.Source)"
                    }

                    $stream = [System.IO.File]::OpenRead($item.FullName)
                    try {
                      $first = $stream.ReadByte()
                      $second = $stream.ReadByte()
                    }
                    finally {
                      $stream.Dispose()
                    }

                    if ($first -ne 0x4D -or $second -ne 0x5A) {
                      throw "NSIS smoke artifact is not a PE executable: $($target.Source)"
                    }

                    Copy-Item -LiteralPath $target.Source -Destination "smoke-windows/Pisi-$version-Setup-$($target.Arch).exe"
                  }

                  Remove-Item 'dist/*.exe' -Force -ErrorAction SilentlyContinue

            - name: Build unsigned Windows Portable packages
              shell: pwsh
              run: |
                  npm run dist:portable -- --x64 --arm64 --publish never -c.extraMetadata.pisiDistribution=portable

                  if ($LASTEXITCODE -ne 0) {
                    exit $LASTEXITCODE
                  }

            - name: Verify Windows Portable package set
              shell: pwsh
              run: |
                  $version = node -p "require('./package.json').version"

                  $targets = @(
                    @{ Arch = 'x64'; Source = "dist/Pisi-$version-win-x64.exe" },
                    @{ Arch = 'arm64'; Source = "dist/Pisi-$version-win-arm64.exe" }
                  )

                  foreach ($target in $targets) {
                    if (-not (Test-Path -LiteralPath $target.Source -PathType Leaf)) {
                      throw "Missing Portable smoke artifact: $($target.Source)"
                    }

                    $item = Get-Item -LiteralPath $target.Source
                    if ($item.Length -le 0) {
                      throw "Empty Portable smoke artifact: $($target.Source)"
                    }

                    $stream = [System.IO.File]::OpenRead($item.FullName)
                    try {
                      $first = $stream.ReadByte()
                      $second = $stream.ReadByte()
                    }
                    finally {
                      $stream.Dispose()
                    }

                    if ($first -ne 0x4D -or $second -ne 0x5A) {
                      throw "Portable smoke artifact is not a PE executable: $($target.Source)"
                    }

                    Copy-Item -LiteralPath $target.Source -Destination "smoke-windows/Pisi-$version-Portable-$($target.Arch).exe"
                  }

                  $expected = @(
                    "Pisi-$version-Setup-x64.exe",
                    "Pisi-$version-Setup-arm64.exe",
                    "Pisi-$version-Portable-x64.exe",
                    "Pisi-$version-Portable-arm64.exe"
                  )

                  foreach ($name in $expected) {
                    $path = Join-Path smoke-windows $name
                    if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                      throw "Missing staged Windows smoke artifact: $path"
                    }
                  }

                  $actual = @(Get-ChildItem smoke-windows -File -Filter '*.exe')
                  if ($actual.Count -ne $expected.Count) {
                    throw "Expected exactly $($expected.Count) Windows smoke artifacts; found $($actual.Count)."
                  }

                  $actual | Sort-Object Name | ForEach-Object {
                    Write-Host "$($_.Name) [$($_.Length) bytes]"
                  }
    macos-package:
        runs-on: macos-latest
        timeout-minutes: 60

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build unsigned macOS packages
              run: |
                  npm run dist:mac -- \
                    -c.mac.identity=null \
                    -c.mac.hardenedRuntime=false \
                    -c.mac.notarize=false \
                    -c.extraMetadata.pisiDistribution=macos

            - name: Verify macOS package set
              shell: bash
              run: |
                  set -euo pipefail

                  dmg_count=$(find dist -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')
                  zip_count=$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')

                  [[ "$dmg_count" -ge 3 ]] || {
                    echo "Expected x64, ARM64 and universal DMG packages; found $dmg_count." >&2
                    find dist -maxdepth 1 -type f -print
                    exit 1
                  }

                  [[ "$zip_count" -ge 3 ]] || {
                    echo "Expected x64, ARM64 and universal ZIP packages; found $zip_count." >&2
                    find dist -maxdepth 1 -type f -print
                    exit 1
                  }

    linux-package:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build Linux packages
              run: npm run dist:linux -- -c.extraMetadata.pisiDistribution=linux

            - name: Verify Linux package set
              shell: bash
              run: |
                  set -euo pipefail

                  mapfile -t debs < <(find dist -maxdepth 1 -type f -name '*.deb' -print)
                  mapfile -t appimages < <(find dist -maxdepth 1 -type f -name '*.AppImage' -print)

                  [[ "${#debs[@]}" -ge 2 ]] || {
                    echo "Expected x64 and ARM64 deb packages." >&2
                    find dist -maxdepth 1 -type f -print
                    exit 1
                  }

                  [[ "${#appimages[@]}" -ge 2 ]] || {
                    echo "Expected x64 and ARM64 AppImage packages." >&2
                    find dist -maxdepth 1 -type f -print
                    exit 1
                  }

                  for package in "${debs[@]}"; do
                    dpkg-deb --info "$package" >/dev/null
                  done

                  for package in "${appimages[@]}"; do
                    file "$package" | grep -Eq 'ELF|AppImage|executable'
                  done
