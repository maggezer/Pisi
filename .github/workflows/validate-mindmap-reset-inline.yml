name: Validate Mind Map Reset Inline

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-mindmap-reset-inline.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - name: Record success
        if: success()
        shell: bash
        run: |
          printf 'validate=success\ncommit=%s\n' "$GITHUB_SHA" > .validate-mindmap-reset-inline.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .validate-mindmap-reset-inline.txt
          git commit -m "Record Mind Map reset inline validation" || exit 0
          git push origin HEAD:main
