name: Apply toolbar right alignment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-empty-toolbar-section
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate codemod syntax
        run: node --check scripts/apply-toolbar-right-alignment.js

      - name: Install dependencies without Electron binary
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Apply toolbar change
        run: node scripts/apply-toolbar-right-alignment.js

      - name: Validate source
        run: npm run validate

      - name: Remove one-time automation
        run: |
          rm scripts/apply-toolbar-right-alignment.js
          rm .github/workflows/apply-toolbar-right-alignment.yml

      - name: Commit toolbar correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove empty toolbar section and right-align controls"
          git push origin agent/remove-empty-toolbar-section
