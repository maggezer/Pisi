name: Apply document ink

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/document-ink-overlay
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without Electron binary
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Apply document ink integration
        run: node scripts/apply-document-ink.js

      - name: Validate source
        run: npm run validate

      - name: Remove one-time automation
        run: |
          rm scripts/apply-document-ink.js
          rm .github/workflows/apply-document-ink.yml

      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enable direct document ink drawing"
          git pull --rebase origin agent/document-ink-overlay
          git push origin agent/document-ink-overlay
