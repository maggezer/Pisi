name: Validate CSS Fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-css-fix.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run full validation
        run: npm run validate
      - name: Record validation success
        if: success()
        shell: bash
        run: |
          printf 'validate=success\ncommit=%s\n' "$GITHUB_SHA" > .validate-css-fix.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .validate-css-fix.txt
          git commit -m "Record CSS fix validation" || exit 0
          git push origin HEAD:main
