name: Apply Mind Map Defaults And Alignment

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-mindmap-defaults-dim-reset.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply requested changes
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          for path in [
              'renderer/map/pisi-map-operational-core.mjs',
              'main/functions/map-operational-store.js',
          ]:
              replace_exact(
                  path,
                  'showTaskDependencies: raw.showTaskDependencies !== false,',
                  'showTaskDependencies: raw.showTaskDependencies === true,'
              )
              replace_exact(
                  path,
                  'showWorkBadges: raw.showWorkBadges !== false,',
                  'showWorkBadges: raw.showWorkBadges === true,'
              )

          replace_exact(
              'renderer/map/pisi-map-property-badges-toggle.mjs',
              """        const value = String(localStorage.getItem(PISI_PROPERTY_BADGES_VISIBLE_STORAGE_KEY) || '').toLowerCase();\n        return !['0', 'false', 'off', 'hidden'].includes(value);\n    } catch {\n        return true;\n""",
              """        const value = String(localStorage.getItem(PISI_PROPERTY_BADGES_VISIBLE_STORAGE_KEY) || '').toLowerCase();\n        if (!value) return false;\n        return ['1', 'true', 'on', 'visible'].includes(value);\n    } catch {\n        return false;\n"""
          )

          css_path = Path('styles/115-mindmap-actions-single-row.css')
          css = css_path.read_text(encoding='utf-8')
          addition = """

/* Keep Dim Filtered pinned to the far right of the primary row. */
#right-tab-mindmap #pisi-map-dim-filtered.pisi-mindmap-icon-button {
    margin-left: auto;
}

/* Reset stays directly below the right edge used by Dim Filtered. */
#right-tab-mindmap .pisi-mindmap-layout-row #pisi-map-operational-reset {
    justify-self: end;
}
"""
          if '#pisi-map-dim-filtered.pisi-mindmap-icon-button' not in css:
              css_path.write_text(css.rstrip() + addition + '\n', encoding='utf-8')

          Path('.github/workflows/apply-mindmap-defaults-dim-reset.yml').unlink()
      - name: Add regression tests
        shell: bash
        run: |
          cat > tests/mindmap-default-visibility.test.js <<'EOF'
          'use strict';

          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const test = require('node:test');

          const root = path.resolve(__dirname, '..');
          const read = (file) => fs.readFileSync(path.join(root, file), 'utf8');

          test('Mind Map task overlays and property badges default to off', () => {
              const rendererCore = read('renderer/map/pisi-map-operational-core.mjs');
              const mainStore = read('main/functions/map-operational-store.js');
              const badgeToggle = read('renderer/map/pisi-map-property-badges-toggle.mjs');

              for (const source of [rendererCore, mainStore]) {
                  assert.match(source, /showTaskDependencies:\s*raw\.showTaskDependencies === true/);
                  assert.match(source, /showWorkBadges:\s*raw\.showWorkBadges === true/);
              }
              assert.match(badgeToggle, /if \(!value\) return false;/);
              assert.match(badgeToggle, /return \['1', 'true', 'on', 'visible'\]\.includes\(value\)/);
              assert.match(badgeToggle, /catch \{\s*return false;/s);
          });

          test('Dim Filtered stays at top-right and Reset aligns below it', () => {
              const css = read('styles/115-mindmap-actions-single-row.css');
              const panel = read('renderer/map/pisi-map-right-panel.mjs');

              assert.match(css, /#pisi-map-dim-filtered\.pisi-mindmap-icon-button\s*\{[^}]*margin-left:\s*auto;/s);
              assert.match(css, /#pisi-map-operational-reset\s*\{[^}]*justify-self:\s*end;/s);

              const primaryStart = panel.indexOf('const mindMapPrimaryActionIds');
              const primaryEnd = panel.indexOf('const mindMapFilterControlIds', primaryStart);
              const primaryBlock = panel.slice(primaryStart, primaryEnd);
              assert.match(primaryBlock, /'pisi-map-dim-filtered'/);
              assert.doesNotMatch(primaryBlock, /'pisi-map-operational-reset'/);

              const layoutStart = panel.indexOf('function ensureMindMapLayoutRow');
              const layoutEnd = panel.indexOf('function enhanceMindMapToolbar', layoutStart);
              const layoutBlock = panel.slice(layoutStart, layoutEnd);
              assert.match(layoutBlock, /'pisi-map-operational-reset'/);
          });
          EOF
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Mind Map defaults and action alignment"
          git push origin HEAD:main
